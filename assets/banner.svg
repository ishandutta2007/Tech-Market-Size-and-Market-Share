<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Dynamic floating dots -->
  <g fill="#00e5ff" filter="url(#glow)">
    <circle cx="150" cy="60" r="5">
      <animate attributeName="cy" values="60;30;60" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="140" r="6">
      <animate attributeName="cy" values="140;110;140" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="150" r="4">
      <animate attributeName="cx" values="200;230;200" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="50" r="5">
      <animate attributeName="cx" values="600;570;600" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <path d="M150 60 L200 150 L600 50 L650 140" stroke="rgba(0, 229, 255, 0.3)" stroke-width="2" fill="none">
    <animate attributeName="stroke-dasharray" values="0 1500; 1500 0" dur="10s" repeatCount="indefinite"/>
  </path>

  <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    Tech Market Size
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="50%" y="72%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#88ccff" letter-spacing="2">
    GLOBAL SECTOR BREAKDOWN
  </text>
</svg>
